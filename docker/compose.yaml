name: stagepilot

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-stagepilot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-stagepilot-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${STAGEPILOT_S3_CORS_ORIGINS:-http://localhost:1420,http://127.0.0.1:1420,tauri://localhost,https://tauri.localhost}
      MINIO_AUDIT_WEBHOOK_ENABLE: "on"
      MINIO_AUDIT_WEBHOOK_ENDPOINT: http://api:8080/internal/storage/audit
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN: "Bearer ${MINIO_AUDIT_WEBHOOK_AUTH_TOKEN:-stagepilot-dev-minio-audit-change-me}"
      MINIO_AUDIT_WEBHOOK_QUEUE_SIZE: 100000
    ports:
      - "${STAGEPILOT_MINIO_PORT:-19000}:9000"
      - "${STAGEPILOT_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app]

  minio-staging-setup:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set stagepilot http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "stagepilot/$${S3_STAGING_BUCKET}" &&
        mc ilm rule import "stagepilot/$${S3_STAGING_BUCKET}" < /config/staging-lifecycle.json
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-stagepilot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-stagepilot-secret}
      S3_STAGING_BUCKET: ${S3_STAGING_BUCKET:-stagepilot-staging}
    volumes:
      - ./minio-staging-lifecycle.json:/config/staging-lifecycle.json:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [app]

  minio-replica:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_REPLICA_ACCESS_KEY:-stagepilot-replica}
      MINIO_ROOT_PASSWORD: ${S3_REPLICA_SECRET_KEY:-stagepilot-replica-secret}
    ports:
      - "${STAGEPILOT_REPLICA_MINIO_PORT:-19010}:9000"
      - "${STAGEPILOT_REPLICA_MINIO_CONSOLE_PORT:-19011}:9001"
    volumes:
      - minio-replica-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [replica]

  minio-replica-setup:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set replica http://minio-replica:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "replica/$${S3_REPLICA_BUCKET}" &&
        mc mb --ignore-existing "replica/$${S3_REPLICA_BACKUP_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_REPLICA_ACCESS_KEY:-stagepilot-replica}
      MINIO_ROOT_PASSWORD: ${S3_REPLICA_SECRET_KEY:-stagepilot-replica-secret}
      S3_REPLICA_BUCKET: ${S3_REPLICA_BUCKET:-stagepilot-file-replica}
      S3_REPLICA_BACKUP_BUCKET: ${S3_REPLICA_BACKUP_BUCKET:-stagepilot-pg-backup}
    depends_on:
      minio-replica:
        condition: service_healthy
    restart: "no"
    networks: [replica]

  postgres:
    image: postgres:17-bookworm
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "wal_level=replica", "-c", "max_wal_senders=6", "-c", "max_replication_slots=4", "-c", "max_slot_wal_keep_size=10GB", "-c", "wal_sender_timeout=60s"]
    environment:
      POSTGRES_DB: ${STAGEPILOT_POSTGRES_DB:-stagepilot}
      POSTGRES_USER: ${STAGEPILOT_POSTGRES_USER:-stagepilot}
      POSTGRES_PASSWORD: ${STAGEPILOT_POSTGRES_PASSWORD:-stagepilot}
    ports:
      - "${STAGEPILOT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app]

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -source=file:///migrations
      - -database=postgres://${STAGEPILOT_POSTGRES_USER:-stagepilot}:${STAGEPILOT_POSTGRES_PASSWORD:-stagepilot}@postgres:5432/${STAGEPILOT_POSTGRES_DB:-stagepilot}?sslmode=disable
      - up
    volumes:
      - ../backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [app]

  api:
    build:
      context: ..
      dockerfile: backend/api/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${STAGEPILOT_POSTGRES_USER:-stagepilot}:${STAGEPILOT_POSTGRES_PASSWORD:-stagepilot}@postgres:5432/${STAGEPILOT_POSTGRES_DB:-stagepilot}?sslmode=disable
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-stagepilot-development-secret-change-me}
      INVITATION_CODE_HASH_KEY: ${INVITATION_CODE_HASH_KEY:-stagepilot-development-invitation-hash-key-change-me}
      INVITATION_CODE_ENCRYPTION_KEY: ${INVITATION_CODE_ENCRYPTION_KEY:-stagepilot-development-invitation-encryption-key-change-me}
      CORS_ALLOWED_ORIGINS: ${STAGEPILOT_CORS_ALLOWED_ORIGINS:-http://localhost:1420,http://127.0.0.1:1420,http://[::1]:1420,http://tauri.localhost,tauri://localhost,https://tauri.localhost}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:19000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-stagepilot}
      S3_STAGING_BUCKET: ${S3_STAGING_BUCKET:-stagepilot-staging}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stagepilot}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-stagepilot-secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_UPLOAD_URL_TTL: ${S3_UPLOAD_URL_TTL:-15m}
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-2000000000}
      FILES_WORKSPACE_PHYSICAL_MAX_BYTES: ${FILES_WORKSPACE_PHYSICAL_MAX_BYTES:-100000000000}
      MINIO_AUDIT_WEBHOOK_AUTH_TOKEN: ${MINIO_AUDIT_WEBHOOK_AUTH_TOKEN:-stagepilot-dev-minio-audit-change-me}
    ports:
      - "${STAGEPILOT_API_PORT:-18080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-staging-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [app]

  worker:
    build:
      context: ..
      dockerfile: backend/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${STAGEPILOT_POSTGRES_USER:-stagepilot}:${STAGEPILOT_POSTGRES_PASSWORD:-stagepilot}@postgres:5432/${STAGEPILOT_POSTGRES_DB:-stagepilot}?sslmode=disable
      WORKER_INTERVAL: ${STAGEPILOT_WORKER_INTERVAL:-30s}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-stagepilot}
      S3_STAGING_BUCKET: ${S3_STAGING_BUCKET:-stagepilot-staging}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stagepilot}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-stagepilot-secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_REPLICA_ENDPOINT: ${S3_REPLICA_ENDPOINT:-http://minio-replica:9000}
      S3_REPLICA_REGION: ${S3_REPLICA_REGION:-us-east-1}
      S3_REPLICA_BUCKET: ${S3_REPLICA_BUCKET:-stagepilot-file-replica}
      S3_REPLICA_ACCESS_KEY: ${S3_REPLICA_ACCESS_KEY:-stagepilot-replica}
      S3_REPLICA_SECRET_KEY: ${S3_REPLICA_SECRET_KEY:-stagepilot-replica-secret}
      S3_REPLICA_USE_SSL: ${S3_REPLICA_USE_SSL:-false}
      S3_REPLICA_REQUIRED: ${S3_REPLICA_REQUIRED:-true}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_UPLOAD_URL_TTL: ${S3_UPLOAD_URL_TTL:-15m}
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-2000000000}
      FILES_WORKSPACE_PHYSICAL_MAX_BYTES: ${FILES_WORKSPACE_PHYSICAL_MAX_BYTES:-100000000000}
      STORAGE_RECONCILE_INTERVAL: ${STORAGE_RECONCILE_INTERVAL:-6h}
      CLAMD_ADDRESS: clamav:3310
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-staging-setup:
        condition: service_completed_successfully
      minio-replica-setup:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    restart: unless-stopped
    networks: [app, scanner, replica]

  pg-backup:
    build:
      context: ..
      dockerfile: docker/backup/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${STAGEPILOT_POSTGRES_USER:-stagepilot}
      PGPASSWORD: ${STAGEPILOT_POSTGRES_PASSWORD:-stagepilot}
      PGDATABASE: ${STAGEPILOT_POSTGRES_DB:-stagepilot}
      PGSSLMODE: ${PGSSLMODE:-disable}
      PGAPPNAME: walg
      WALG_SLOTNAME: walg
      BASE_BACKUP_RETRY_SECONDS: ${BASE_BACKUP_RETRY_SECONDS:-300}
      WALG_S3_PREFIX: s3://${S3_REPLICA_BACKUP_BUCKET:-stagepilot-pg-backup}/postgres
      AWS_ENDPOINT: ${S3_REPLICA_ENDPOINT:-http://minio-replica:9000}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ${S3_REPLICA_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_REPLICA_ACCESS_KEY:-stagepilot-replica}
      AWS_SECRET_ACCESS_KEY: ${S3_REPLICA_SECRET_KEY:-stagepilot-replica-secret}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      WAL_WATERMARK_INTERVAL_SECONDS: ${WAL_WATERMARK_INTERVAL_SECONDS:-300}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-replica-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [app, replica]

  clamav:
    image: clamav/clamav:1.5.4_base
    volumes:
      - clamav-db:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "clamdscan", "--stream", "--ping=1:1", "/etc/hostname"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    restart: unless-stopped
    networks: [scanner]

volumes:
  postgres-data:
  minio-data:
  minio-replica-data:
  clamav-db:

networks:
  app:
    driver: bridge
  scanner:
    driver: bridge
  replica:
    driver: bridge
