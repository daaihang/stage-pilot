[package]
name = "stagepilot-desktop"
version = "0.1.0"
description = "StagePilot desktop application"
authors = ["StagePilot Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stagepilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-decoration = "3.0.5"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "multipart", "rustls"] }
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
bytes = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
